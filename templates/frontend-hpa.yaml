apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: frontend-hpa
spec:
  scaleTargetRef: 
    apiVersion: apps/v1
    kind: Deployment
    name: frontend
  minReplicas: {{.Values.frontend.hpa.min}}
  maxReplicas: {{.Values.frontend.hpa.max}}
  metrics:
    - type: Resource 
      resource: 
        name: cpu 
        target: 
          type: Utilization
          averageUtilization: {{.Values.frontend.hpa.targetCpu}}